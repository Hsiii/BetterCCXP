name: Feature request
description: Suggest an improvement to ccxpLite
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the current difficulty rather than only describing a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how the extension should behave, including defaults and important edge cases.
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Affected CCXP page
      description: Include the path after the hostname. Remove session IDs or other sensitive values.
      placeholder: /ccxp/INQUIRE/...

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Include other approaches you considered and any navigation, accessibility, or browser-compatibility impact.

  - type: textarea
    id: visuals
    attributes:
      label: Mockups or examples
      description: Add screenshots or references when the request changes the interface.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests for the same request.
          required: true
        - label: I removed credentials, session IDs, and personal information from this request.
          required: true
